# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Matching scratch storage
description: Equivalent tmpfs requests with aliased destinations
args:
  volume_path:
    default: /var/tmp/kit-tck-volume/
  volume_size:
    default: 1024m
  volume_mode:
    default: "0700"
capabilities:
  - type: com.docker.sandbox/volume@1
    name: Equivalent scratch storage
    optional: true
    source: {kit: registry.example/other-storage:latest, path: "capabilities[0]"}
    config:
      tmpfs: true
      path: "${{ kit.args.volume_path }}"
      size: "${{ kit.args.volume_size }}"
      mode: "700"
  - type: com.docker.sandbox/volume@1
    config: {path: /var/tmp/kit-tck-volume-other/, size: 1024m, mode: "700", tmpfs: true}
